<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Shut Down</title>
  <style>
    /* Reset & Base Styles */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glows */
    .glow-1, .glow-2 {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.25;
      z-index: 0;
    }

    .glow-1 {
      width: 350px;
      height: 350px;
      background: #6366f1;
      top: 20%;
      left: 20%;
    }

    .glow-2 {
      width: 300px;
      height: 300px;
      background: #06b6d4;
      bottom: 20%;
      right: 20%;
    }

    /* Main Content Box */
    .container {
      position: relative;
      z-index: 10;
      max-width: 520px;
      width: 100%;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.25rem;
      padding: 3rem 2rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
    }

    /* Shutdown Badge/Icon */
    .icon-wrapper {
      width: 64px;
      height: 64px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #818cf8;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem auto;
    }

    .title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: -0.02em;
    }

    .description {
      margin-top: 1rem;
      color: #94a3b8;
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .description a.inline-link {
      color: #818cf8;
      text-decoration: underline;
      text-underline-offset: 4px;
      transition: color 0.2s ease;
    }

    .description a.inline-link:hover {
      color: #a5b4fc;
    }

    /* Primary Action Button */
    .actions {
      margin-top: 2.25rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.85rem 1.75rem;
      border-radius: 0.6rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      font-size: 1rem;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.35);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(99, 102, 241, 0.5);
    }

    .btn svg {
      transition: transform 0.2s ease;
    }

    .btn:hover svg {
      transform: translateX(3px);
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .container { padding: 2rem 1.25rem; }
      .title { font-size: 1.5rem; }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <main class="container">
    <div class="icon-wrapper">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
    </div>

    <h1 class="title">Website Offline</h1>
    
    <p class="description">
      Sorry, but this website has been shut down. Feel free to visit <a href="https://www.turbov.dev" class="inline-link">www.turbov.dev</a>!
    </p>

    <div class="actions">
      <a href="https://www.turbov.dev" class="btn">
        Visit www.turbov.dev
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </a>
    </div>
  </main>

</body>
</html>
